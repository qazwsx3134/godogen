<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Taskbar Hero — 成長與波次驗收</title><style>body{margin:0;background:#172337;color:#f2e0c7;font:16px system-ui}main{max-width:1200px;margin:auto;padding:24px}h1{font-size:24px}button,select{font:inherit;padding:8px 12px;background:#314864;color:inherit;border:1px solid #8193ac;border-radius:5px;margin:4px;cursor:pointer}button[aria-pressed=true]{border-color:#efd083;background:#516385}.panels{display:flex;align-items:start;gap:20px}.panels figure{flex:1;margin:12px 0;min-width:0;text-align:center}img{max-width:100%;max-height:85vh;object-fit:contain}figcaption{padding:8px}p{line-height:1.6;color:#c5cddb}.waves{display:flex;gap:12px}.waves figure{margin:0;flex:1}.waves img{width:100%}@media(max-width:600px){.panels{gap:8px}main{padding:12px}}</style><main><h1>Taskbar Hero — 成長與波次驗收</h1><p>左側為使用者圖稿，右側為 Godot 實際渲染。展開頁統一高度、六格導覽及多怪獸隊伍依最新需求調整。角色／背景仍使用暫用原圖素材；此頁不是逐像素 1:1 完成宣告。</p><nav id="pages"></nav><label>實際畫面尺寸 <select id="size"><option>941x1672</option><option>390x844</option><option>320x568</option></select></label><div class="panels"><figure><figcaption>使用者圖稿</figcaption><img id="original"></figure><figure><figcaption>Godot 實際渲染</figcaption><img id="actual"></figure></div><h2>清波後行軍</h2><p>同一場景的三個狀態：戰鬥 → 快速行軍 → 下一波士兵。近景比遠景移動快，切頁與暫停保留進度。</p><div class="waves"><figure><img src="waves/01-combat.png"><figcaption>第一波</figcaption></figure><figure><img src="waves/02-marching.png"><figcaption>清波行軍</figcaption></figure><figure><img src="waves/03-soldier-wave.png"><figcaption>第二波士兵</figcaption></figure></div></main><script>const pages={overview:['總覽','idel'],train:['訓練','train'],backpack:['背包','backpack'],monster:['怪獸','monster'],equipment:['裝備','equipment'],adventure:['冒險','adventure'],store:['商店','store']};let active='equipment';const nav=document.querySelector('#pages'),size=document.querySelector('#size');for(const [key,[name]] of Object.entries(pages)){const b=document.createElement('button');b.textContent=name;b.dataset.page=key;b.onclick=()=>{active=key;render()};nav.append(b)}function render(){document.querySelector('#original').src='../../../../docs/taskbar-hero-mobile-spec/images/'+pages[active][1]+'.png';document.querySelector('#actual').src=size.value+'/'+active+'.png';document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.page===active))}size.onchange=render;render();</script></html>
