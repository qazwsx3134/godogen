# Game-specific Studio settings; shared workflows are in ../../studio/runtime/codex/.
schema_version: 1
framework:
  version: 1.1.3
  last_upgraded: 2026-10-16
project:
  name: "萬事屋吐槽 ADV"
  stage: Production
engine:
  name: Godot
  version: "4.7"
  language: GDScript
  rendering: GL Compatibility
paths:
  code_root: scripts
modes:
  rigor: minimal
  automation: guided
performance:
  enforce: warn
# Device frame-time, draw-call and memory budgets await measured targets.
commands:
  test: "bash ../godot-kit/tools/run_tests.sh ."
